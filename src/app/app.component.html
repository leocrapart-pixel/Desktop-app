<main>
  <p class="kicker">You have been</p>
  <h1>Rickrolled</h1>
  <p class="sub">Never Gonna Give You Up is playing in your browser.</p>

  <button type="button" (click)="again()" [disabled]="busy()">
    {{ busy() ? "Opening…" : "Play it again" }}
  </button>

  @if (failed()) {
    <p class="error" role="alert">
      Could not launch the browser. The video lives at
      <code>youtube.com/watch?v=dQw4w9WgXcQ</code>
    </p>
  }
</main>
